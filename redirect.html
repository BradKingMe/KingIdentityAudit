<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Microsoft Authentication</title></head>
  <body>
    <p id="status">Completing Microsoft authentication…</p>
    <script type="module">
      import { broadcastResponseToMainFrame } from "@azure/msal-browser/redirect-bridge";
      broadcastResponseToMainFrame().catch(() => {
        document.getElementById("status").textContent = "Authentication could not return to KingIdentity. Close this window and retry from the dashboard.";
      });
    </script>
  </body>
</html>
